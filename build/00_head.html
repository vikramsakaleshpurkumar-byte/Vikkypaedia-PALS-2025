<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Paediatric Advanced Life Support 2025: a mastery-based, self-paced module on paediatric resuscitation written from the 2025 AHA/AAP guidelines — CPR, arrest pathways, arrhythmias and post-arrest care. Not the AHA PALS course. Works offline.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d7a70">
<title>Paediatric Advanced Life Support 2025 &middot; Vikkypaedia</title>
<style>
/* ============================================================
   Vikkypaedia · Standard design system (Clinical Modern)
   Design system v2 — "Clinical Modern"
   Single-file, offline, mobile-first. No CDN. No network.
   ============================================================ */

@property --progress{syntax:'<number>';inherits:true;initial-value:0}

/* ---------- tokens: light is the base ---------- */
:root{
  --progress:0;

  --paper:#f4f6f8;
  --paper-2:#eceff3;
  --surface:#ffffff;
  --surface-2:#f2f5f8;
  --surface-3:#e3e9ef;
  --ink:#0b1220;
  --ink-2:#3d4859;
  --ink-3:#5b6778;
  --line:#e2e8ef;
  --line-2:#cdd7e2;

  --brand:#0d7a70;
  --brand-600:#0a6259;
  --brand-ink:#064e46;
  --brand-soft:#e2f3f0;
  --brand-glow:rgba(13,122,112,.22);

  --accent:#1d5fa8;
  --accent-soft:#e6eef8;

  --amber:#9a5b09;
  --amber-soft:#fbf0dc;
  --red:#a8271f;
  --red-soft:#fbe9e7;
  --green:#1c6b39;
  --green-soft:#e2f3e8;
  --violet:#5b4a9e;
  --violet-soft:#eeebf9;
  --blue:#1d5b94;
  --blue-soft:#e6eff8;

  --must:#a8271f;
  --good:#9a5b09;
  --nice:#5b4a9e;

  /* per-Part accents */
  --pA:#0d7a70;
  --pB:#a3620b;
  --pC:#1d5fa8;
  --pD:#a8271f;
  --pE:#5b4a9e;
  --pA-soft:#e2f3f0;
  --pB-soft:#fbf0dc;
  --pC-soft:#e6eef8;
  --pD-soft:#fbe9e7;
  --pE-soft:#eeebf9;

  --r-xs:6px;
  --radius:12px;
  --r-sm:9px;
  --radius-lg:16px;
  --r-xl:22px;

  --sh-1:0 1px 2px rgba(11,18,32,.05);
  --shadow:0 1px 2px rgba(11,18,32,.04), 0 6px 18px -6px rgba(11,18,32,.10);
  --sh-2:0 2px 4px rgba(11,18,32,.04), 0 14px 32px -10px rgba(11,18,32,.14);
  --sh-3:0 6px 12px rgba(11,18,32,.05), 0 28px 56px -16px rgba(11,18,32,.20);

  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --btn-ink:#ffffff;
  --fs:16px;
  --maxw:1240px;
  --topbar-h:56px;
}

/* ---------- dark: system default (no explicit choice stamped) ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0a0d12;
    --paper-2:#0e1218;
    --surface:#141a22;
    --surface-2:#1b222c;
    --surface-3:#26303c;
    --ink:#e9edf2;
    --ink-2:#b3bdca;
    --ink-3:#8492a3;
    --line:#242d39;
    --line-2:#36414f;

    --brand:#4fd0c2;
    --brand-600:#6bdccf;
    --brand-ink:#a5e9e0;
    --brand-soft:#0e2f2c;
    --brand-glow:rgba(79,208,194,.20);

    --accent:#79b3e8;
    --accent-soft:#132639;

    --amber:#e3ab5a;
    --amber-soft:#33260f;
    --red:#f08a80;
    --red-soft:#3a1a17;
    --green:#63c98a;
    --green-soft:#12301e;
    --violet:#b0a2ef;
    --violet-soft:#221d3a;
    --blue:#79b3e8;
    --blue-soft:#152a3f;

    --must:#f08a80;
    --good:#e3ab5a;
    --nice:#b0a2ef;

    --pA:#4fd0c2;
    --pB:#e3ab5a;
    --pC:#79b3e8;
    --pD:#f08a80;
    --pE:#b0a2ef;
    --pA-soft:#0e2f2c;
    --pB-soft:#33260f;
    --pC-soft:#152a3f;
    --pD-soft:#3a1a17;
    --pE-soft:#221d3a;

    --btn-ink:#04211e;
    --sh-1:0 1px 2px rgba(0,0,0,.5);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px -8px rgba(0,0,0,.55);
    --sh-2:0 2px 6px rgba(0,0,0,.45), 0 18px 40px -12px rgba(0,0,0,.6);
    --sh-3:0 8px 18px rgba(0,0,0,.5), 0 34px 64px -18px rgba(0,0,0,.7);
  }
}
/* ---------- dark: explicit choice ---------- */
:root[data-theme="dark"]{
  --paper:#0a0d12;
  --paper-2:#0e1218;
  --surface:#141a22;
  --surface-2:#1b222c;
  --surface-3:#26303c;
  --ink:#e9edf2;
  --ink-2:#b3bdca;
  --ink-3:#8492a3;
  --line:#242d39;
  --line-2:#36414f;
  --brand:#4fd0c2;
  --brand-600:#6bdccf;
  --brand-ink:#a5e9e0;
  --brand-soft:#0e2f2c;
  --brand-glow:rgba(79,208,194,.20);
  --accent:#79b3e8;
  --accent-soft:#132639;
  --amber:#e3ab5a;
  --amber-soft:#33260f;
  --red:#f08a80;
  --red-soft:#3a1a17;
  --green:#63c98a;
  --green-soft:#12301e;
  --violet:#b0a2ef;
  --violet-soft:#221d3a;
  --blue:#79b3e8;
  --blue-soft:#152a3f;
  --must:#f08a80;
  --good:#e3ab5a;
  --nice:#b0a2ef;
  --pA:#4fd0c2;
  --pB:#e3ab5a;
  --pC:#79b3e8;
  --pD:#f08a80;
  --pE:#b0a2ef;
  --pA-soft:#0e2f2c;
  --pB-soft:#33260f;
  --pC-soft:#152a3f;
  --pD-soft:#3a1a17;
  --pE-soft:#221d3a;
  --btn-ink:#04211e;
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px -8px rgba(0,0,0,.55);
  --sh-2:0 2px 6px rgba(0,0,0,.45), 0 18px 40px -12px rgba(0,0,0,.6);
  --sh-3:0 8px 18px rgba(0,0,0,.5), 0 34px 64px -18px rgba(0,0,0,.7);
}

/* ---------- learner text scaling ---------- */
:root[data-fs="s"]{--fs:15px}
:root[data-fs="m"]{--fs:16px}
:root[data-fs="l"]{--fs:18px}
:root[data-fs="xl"]{--fs:20px}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--topbar-h) + 12px)}
body{
  margin:0; padding:0;
  background:var(--paper); color:var(--ink);
  font:var(--fs)/1.65 var(--sans);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;height:auto}
[hidden]{display:none !important}
h1,h2,h3,h4,h5{line-height:1.22;margin:0 0 .5em;font-weight:700;letter-spacing:-.015em}
p{margin:0 0 .85em}
a{color:var(--brand);text-underline-offset:2px}
a:hover{color:var(--brand-ink)}
hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
small{font-size:.86em}
code,kbd{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:.12em .38em;border-radius:5px;border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
ul,ol{padding-left:1.25em;margin:0 0 .9em}
li{margin:.25em 0}
sup{font-size:.68em;line-height:0;vertical-align:.45em}
::selection{background:var(--brand-soft);color:var(--brand-ink)}

.skip{
  position:absolute;left:-9999px;top:0;z-index:999;
  background:var(--brand);color:#fff;padding:.7em 1.1em;border-radius:0 0 var(--radius) 0;
}
.skip:focus{left:0}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:18px}
.shell{max-width:var(--maxw);margin:0 auto;padding-inline:18px}

@media (min-width:980px){
  .shell{display:grid;grid-template-columns:262px minmax(0,1fr);gap:40px;align-items:start}
}

/* ============================================================
   TOPBAR — sticky at every width
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:70;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
@supports not (backdrop-filter:blur(2px)){ .topbar{background:var(--surface)} }
.topbar-in{
  max-width:var(--maxw);margin:0 auto;padding:0 18px;
  height:var(--topbar-h);display:flex;align-items:center;gap:12px;
}
.topbar .nb-title{
  font-weight:700;font-size:.95rem;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tb-mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  background-color:var(--brand);background-image:linear-gradient(145deg,var(--brand),var(--brand-600));
  color:var(--btn-ink);font-weight:800;font-size:.82rem;letter-spacing:-.02em;
  box-shadow:0 2px 8px var(--brand-glow);
}
.tb-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.tb-pct{
  font-size:.76rem;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:.2em .65em;
  white-space:nowrap;
}
@media (max-width:520px){.tb-pct{display:none}}
.topline{height:2px;background:var(--surface-3)}
.topline > i{
  display:block;height:100%;width:calc(var(--progress) * 1%);
  background-color:var(--brand);background-image:linear-gradient(90deg,var(--brand),var(--accent));
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
#drawerOpen{display:inline-flex}
@media (min-width:980px){#drawerOpen{display:none}}

.iconbtn{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  min-width:40px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.9rem;padding:0 .6em;color:var(--ink-2);
  transition:background .15s ease,border-color .15s ease,transform .12s ease;
}
.iconbtn:hover{background:var(--surface-3);border-color:var(--line-2);color:var(--ink)}
.iconbtn:active{transform:scale(.96)}

/* legacy alias kept so older markup/print rules still resolve */
.navbar{display:none}

.drawer{position:fixed;inset:0;z-index:100;background:rgba(3,8,15,.55);display:none}
.drawer[data-open="1"]{display:block;animation:fade .18s ease}
.drawer-panel{
  position:absolute;left:0;top:0;bottom:0;width:min(86vw,340px);
  background:var(--paper);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 18px 44px;box-shadow:var(--sh-3);
  animation:slideIn .22s cubic-bezier(.4,0,.2,1);
}
.drawer-panel .close{margin-bottom:.8em}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(-16px);opacity:.4}to{transform:none;opacity:1}}

/* ============================================================
   HERO
   ============================================================ */
.masthead{
  position:relative;overflow:hidden;
  border-bottom:1px solid var(--line);
  background:
    radial-gradient(1100px 440px at 6% -18%, var(--brand-soft) 0%, transparent 62%),
    radial-gradient(860px 380px at 98% -10%, var(--accent-soft) 0%, transparent 58%),
    linear-gradient(180deg,var(--surface) 0%,var(--paper) 100%);
}
.masthead::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(700px 320px at 30% 0%, #000 0%, transparent 75%);
  mask-image:radial-gradient(700px 320px at 30% 0%, #000 0%, transparent 75%);
}
.masthead-in{
  position:relative;max-width:var(--maxw);margin:0 auto;padding:38px 18px 34px;
  display:grid;gap:26px;
}
@media (min-width:960px){
  .masthead-in{grid-template-columns:minmax(0,1fr) 306px;gap:44px;align-items:center;padding:52px 18px 46px}
}
.brandline{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--brand);font-weight:800;
}
.brandline .dot{width:4px;height:4px;border-radius:50%;background:var(--brand);opacity:.55}
.brandline .sub{color:var(--ink-3);font-weight:700;letter-spacing:.11em}
.masthead h1{
  font-weight:800;letter-spacing:-.035em;
  font-size:clamp(2rem,6vw,3.35rem);margin:.3em 0 .22em;line-height:1.04;
  background:linear-gradient(160deg,var(--ink) 20%,var(--brand-ink) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
:root[data-theme="dark"] .masthead h1,
:root:not([data-theme="light"]) .masthead h1{}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .masthead h1{background:linear-gradient(160deg,var(--ink) 25%,var(--brand) 140%);-webkit-background-clip:text;background-clip:text;color:transparent}
}
:root[data-theme="dark"] .masthead h1{background:linear-gradient(160deg,var(--ink) 25%,var(--brand) 140%);-webkit-background-clip:text;background-clip:text;color:transparent}
.masthead .mast-tag{color:var(--ink-2);max-width:60ch;margin:0 0 1em;font-size:1.06em;line-height:1.6}
.principle{
  font-family:var(--serif);font-style:italic;color:var(--brand-ink);
  border-left:3px solid var(--brand);padding-left:.95em;margin:0 0 1.15em;max-width:56ch;font-size:1.02em;
}
:root[data-theme="dark"] .principle{color:var(--brand-ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:.2em}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:.3em .8em;font-size:.775rem;color:var(--ink-2);white-space:nowrap;
  box-shadow:var(--sh-1);
}
.chip b{color:var(--ink);font-weight:700}
.cert-chip{text-decoration:none;border-color:color-mix(in srgb,var(--brand) 38%,var(--line));background:var(--brand-soft);color:var(--brand-ink)}
.cert-chip:hover{border-color:var(--brand);transform:translateY(-1px)}

/* hero progress card */
.hero-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:22px 20px;box-shadow:var(--sh-2);text-align:center;
}
.ring{
  --ring-size:126px;
  width:var(--ring-size);height:var(--ring-size);margin:0 auto .9em;
  border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(from -90deg, var(--brand) calc(var(--progress) * 3.6deg), var(--surface-3) 0);
  transition:--progress .7s cubic-bezier(.4,0,.2,1);
}
.ring::after{
  content:"";position:absolute;inset:11px;border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);
}
.ring-val{position:relative;z-index:1;text-align:center;line-height:1.1}
.ring-val b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring-val span{display:block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-top:.15em}
.hero-card h2{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 .9em;font-weight:800}
.hero-card .hc-note{font-size:.84rem;color:var(--ink-3);margin:.75em 0 0}
.hero-card .btnrow{justify-content:center;margin-top:.2em}
.cert-path{
  display:flex;gap:10px;align-items:flex-start;text-align:left;margin:1.1em 0 .7em;
  padding:12px;border:1px solid color-mix(in srgb,var(--brand) 28%,var(--line));
  border-radius:14px;background:linear-gradient(135deg,var(--brand-soft),var(--surface));
}
.cert-path-icon{
  flex:0 0 30px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;
  background:var(--brand);color:#fff;font-weight:900;box-shadow:0 5px 14px var(--brand-glow);
}
.cert-path b{display:block;font-size:.88rem;line-height:1.25;color:var(--ink)}
.cert-path span:not(.cert-path-icon){display:block;margin-top:.25em;font-size:.75rem;line-height:1.45;color:var(--ink-2)}
.cert-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cert-actions a{
  min-height:44px;display:flex;align-items:center;justify-content:center;padding:.55em .65em;
  border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--brand-ink);
  font-size:.73rem;font-weight:750;line-height:1.25;text-decoration:none;
}
.cert-actions a:hover{border-color:var(--brand);background:var(--brand-soft)}
.cert-gate-card{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.cert-gate-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--brand)}
.cert-gate-card .cert-sample-link{display:inline-flex;align-items:center;min-height:44px;margin-top:.35em;font-weight:750}
@media(max-width:480px){.cert-actions{grid-template-columns:1fr}}

/* ============================================================
   STEPPER (learning arc)
   ============================================================ */
.arc{
  display:flex;gap:10px;overflow-x:auto;scrollbar-width:thin;
  margin:24px 0 22px;padding:2px 2px 10px;
}
.arc::-webkit-scrollbar{height:6px}
.arc::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
.arc-step{
  flex:1 0 auto;min-width:146px;max-width:220px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:.7em .9em .75em;font-size:.8rem;color:var(--ink-2);position:relative;
  box-shadow:var(--sh-1);
  border-top:3px solid var(--acc,var(--line-2));
}
.arc-step b{display:block;color:var(--ink);font-size:.85rem;font-weight:700;letter-spacing:-.01em}
.arc-step span{font-size:.73rem;color:var(--ink-3);display:block;line-height:1.4}
.arc-step[data-p="A"]{--acc:var(--pA)}
.arc-step[data-p="B"]{--acc:var(--pB)}
.arc-step[data-p="C"]{--acc:var(--pC)}
.arc-step[data-p="D"]{--acc:var(--pD)}
.arc-step[data-p="E"]{--acc:var(--pE)}

/* ---------- sidebar ---------- */
.side{display:none}
@media (min-width:980px){
  .side{
    display:block;position:sticky;top:calc(var(--topbar-h) + 14px);
    max-height:calc(100vh - var(--topbar-h) - 28px);overflow-y:auto;
    padding:2px 6px 30px 0;font-size:.89rem;scrollbar-width:thin;
  }
  .side::-webkit-scrollbar{width:6px}
  .side::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
}
.side nav,.drawer-panel nav{font-size:.89rem}
.side h4,.drawer-panel h4{
  font-size:.67rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin:1.5em 0 .5em;font-weight:800;
}
.side h4:first-child,.drawer-panel h4:first-child{margin-top:.2em}
.side a,.drawer-panel nav a{
  display:block;padding:.36em .6em;border-radius:8px;color:var(--ink-2);
  text-decoration:none;line-height:1.4;transition:background .14s ease,color .14s ease;
}
.side a:hover,.drawer-panel nav a:hover{background:var(--surface-2);color:var(--ink)}
.side a.locked,.drawer-panel nav a.locked{color:var(--ink-3);opacity:.55}
.side a .u,.drawer-panel nav a .u{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:.84em;margin-right:.45em;font-weight:700}
.side .part-label,.drawer-panel .part-label{
  display:flex;align-items:center;gap:.5em;flex-wrap:wrap;
  font-weight:800;color:var(--ink);margin-top:1.1em;font-size:.78rem;
  letter-spacing:.01em;padding-left:.6em;border-left:3px solid var(--line-2);line-height:1.35;
}
.lk{
  font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
  background:var(--surface-3);color:var(--ink-2);border-radius:4px;padding:.18em .42em;
  white-space:nowrap;
}

/* ============================================================
   ONBOARDING / FIRST RUN
   ============================================================ */
.onb{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(4,10,18,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:16px;animation:fade .2s ease;overflow-y:auto;
}
.onb-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-3);width:min(660px,100%);max-height:calc(100vh - 32px);
  display:flex;flex-direction:column;overflow:hidden;animation:rise .26s cubic-bezier(.4,0,.2,1);
}
@keyframes rise{from{transform:translateY(14px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.onb-head{
  display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);
  background:
    radial-gradient(500px 160px at 0% 0%, var(--brand-soft) 0%, transparent 70%),
    var(--surface);
}
.onb-dots{display:flex;gap:6px;flex:1}
.onb-dots i{
  height:4px;flex:1;border-radius:99px;background:var(--surface-3);
  transition:background .25s ease;
}
.onb-dots i[data-on="1"]{background:var(--brand)}
.onb-skip{
  background:none;border:0;color:var(--ink-3);font-size:.8rem;cursor:pointer;
  padding:.3em .5em;border-radius:7px;font-weight:600;
}
.onb-skip:hover{background:var(--surface-2);color:var(--ink)}
.onb-body{padding:24px 24px 6px;overflow-y:auto;flex:1;min-height:0}
.onb-step{animation:unfold .24s ease}
.onb-step h2{font-size:1.5rem;letter-spacing:-.03em;margin:0 0 .35em}
.onb-step > p{color:var(--ink-2)}
.onb-kicker{
  font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);
  font-weight:800;margin-bottom:.55em;
}
.onb-foot{
  display:flex;gap:10px;justify-content:space-between;align-items:center;
  padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);
}
.onb-foot .grow{flex:1}
.onb-list{list-style:none;padding:0;margin:1.1em 0 0}
.onb-list li{
  display:flex;gap:.8em;align-items:flex-start;margin:.7em 0;font-size:.94rem;color:var(--ink-2);
}
.onb-list li b{color:var(--ink)}
.onb-list .n{
  flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--brand-soft);
  color:var(--brand-ink);font-weight:800;font-size:.76rem;display:grid;place-items:center;margin-top:.1em;
}
:root[data-theme="dark"] .onb-list .n{color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .onb-list .n{color:var(--brand)}}
.onb-note{
  font-size:.83rem;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:.7em .9em;margin:1.1em 0 0;
}
.onb .place-q > p{font-size:.96rem}
.onb .card{border:0;box-shadow:none;padding:0;margin:0;background:none}
.onb .card > h2{display:none}

.plan-grid{display:grid;gap:10px;margin:1.1em 0 0}
@media (min-width:560px){.plan-grid{grid-template-columns:1fr 1fr}}
.plan-tile{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:.8em .95em;
}
.plan-tile .pv{font-size:1.16rem;font-weight:800;letter-spacing:-.025em;display:block;line-height:1.3}
.plan-tile .pl{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.plan-controls{display:flex;flex-wrap:wrap;gap:14px;margin-top:1.1em;align-items:flex-end}
.plan-controls > div{min-width:10.5rem}
.plan-controls label{display:block;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:800;margin-bottom:.3em}
.plan-controls select{
  padding:.5em .6em;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);font:inherit;font-size:.88rem;min-height:40px;
}

/* ---------- profile bar ---------- */
.profile-bar{
  display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:12px 16px;margin:0 0 18px;box-shadow:var(--sh-1);
}
.pb-id{display:flex;gap:11px;align-items:center;min-width:0}
.pb-id > .pb-avatar{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background-color:var(--brand);background-image:linear-gradient(145deg,var(--brand),var(--brand-600));
  color:var(--btn-ink);font-weight:800;font-size:.9rem;letter-spacing:.01em;line-height:1;
}
.pb-id > div{min-width:0}
.pb-id > div > b{display:block;font-size:.96rem;letter-spacing:-.015em;line-height:1.3}
.pb-id > div > span{display:block;font-size:.78rem;color:var(--ink-3)}
.pb-plan{
  font-size:.79rem;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:.3em .8em;
}
.profile-bar .grow{flex:1}

/* ---------- generic card ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:22px;margin:0 0 20px;box-shadow:var(--shadow);
}
.card > h2, .card > h3{margin-top:0}

/* ---------- dashboard ---------- */
.dash-head{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.dash-head h2{font-size:1.22rem;margin:0;letter-spacing:-.02em}
.dash-status{font-size:.88rem;color:var(--ink-2)}
.bar{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:.9em 0 .2em}
.bar > i{
  display:block;height:100%;border-radius:99px;
  background-color:var(--brand);background-image:linear-gradient(90deg,var(--brand),var(--accent));
  transition:width .55s cubic-bezier(.4,0,.2,1);
}
.bar-note{font-size:.8rem;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:1.1em 0 .2em}
.stat{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:.75em .9em;
}
.stat .sv{font-size:1.02rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);display:block;line-height:1.3}
.stat .sl{font-size:.67rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:800}

.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px;margin:1.2em 0 .8em}
.ucell{
  aspect-ratio:1/1;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;
  color:var(--ink-3);cursor:pointer;position:relative;font-variant-numeric:tabular-nums;
  min-height:40px;transition:transform .13s ease,box-shadow .13s ease,border-color .13s ease;
}
.ucell:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--sh-1)}
.ucell[data-s="attempted"]{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.ucell[data-s="mastered"]{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.ucell[data-s="review"]{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}
.ucell[data-s="locked"]{opacity:.42;cursor:not-allowed}
.ucell[data-s="locked"]:hover{transform:none;box-shadow:none}
.ucell[data-s="mastered"]::after{content:"✓";position:absolute;top:0;right:3px;font-size:.6rem;opacity:.8}
.ucell[data-s="review"]::after{content:"↻";position:absolute;top:0;right:3px;font-size:.6rem;opacity:.85}

.legend{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:.78rem;color:var(--ink-2);margin-top:.6em}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.lg-n{background:var(--surface-2)}
.lg-a{background:var(--amber-soft);border-color:var(--amber)}
.lg-m{background:var(--green-soft);border-color:var(--green)}
.lg-r{background:var(--blue-soft);border-color:var(--blue)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  background-color:var(--brand);background-image:linear-gradient(160deg,var(--brand),var(--brand-600));
  color:var(--btn-ink);border:1px solid transparent;
  border-radius:10px;padding:.62em 1.15em;font-size:.92rem;font-weight:650;
  cursor:pointer;min-height:44px;text-decoration:none;letter-spacing:-.005em;
  box-shadow:0 1px 2px rgba(11,18,32,.10), 0 6px 16px -8px var(--brand-glow);
  transition:transform .13s ease,box-shadow .18s ease,filter .15s ease;
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 2px 4px rgba(11,18,32,.10), 0 12px 24px -10px var(--brand-glow);color:var(--btn-ink)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
.btn.ghost{background-image:none;background-color:var(--surface);color:var(--ink);border-color:var(--line-2);box-shadow:var(--sh-1)}
.btn.ghost:hover{background:var(--surface-2);filter:none;color:var(--ink)}
.btn.sm{min-height:36px;padding:.35em .85em;font-size:.84rem;border-radius:9px}
.btn.danger{background-image:none;background-color:var(--red);border-color:transparent;color:#fff}
:root[data-theme="dark"] .btn.danger{color:#2a0d0a}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:1em}

/* ---------- toolbar ---------- */
.toolbar{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:14px 16px;margin:0 0 20px;box-shadow:var(--sh-1);
}
.tb-group{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:.4em 0}
.tb-label{font-size:.67rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:800;min-width:80px}
.toggle{
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:.32em .85em;font-size:.79rem;cursor:pointer;min-height:34px;color:var(--ink-2);
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.toggle:hover{background:var(--surface-3);color:var(--ink)}
.toggle[aria-pressed="true"]{
  background-color:var(--brand);background-image:linear-gradient(160deg,var(--brand),var(--brand-600));
  border-color:transparent;color:var(--btn-ink);font-weight:650;
  box-shadow:0 2px 8px -3px var(--brand-glow);
}

/* ---------- priority filtering ---------- */
:root[data-pri="must"] .tier-good,
:root[data-pri="must"] .tier-nice{display:none}
:root[data-pri="core"] .tier-nice{display:none}
:root[data-lvl="e"] .lv-a,
:root[data-lvl="e"] .lv-x{display:none}
:root[data-lvl="a"] .lv-x{display:none}
:root[data-set="ideal"] .track-rc{display:none}
:root[data-set="rc"] .track-id{display:none}

/* ============================================================
   PARTS & UNITS
   ============================================================ */
.part{margin:40px 0 12px;--acc:var(--brand);--acc-soft:var(--brand-soft)}
.part[data-part="A"]{--acc:var(--pA);--acc-soft:var(--pA-soft)}
.part[data-part="B"]{--acc:var(--pB);--acc-soft:var(--pB-soft)}
.part[data-part="C"]{--acc:var(--pC);--acc-soft:var(--pC-soft)}
.part[data-part="D"]{--acc:var(--pD);--acc-soft:var(--pD-soft)}
.part[data-part="E"]{--acc:var(--pE);--acc-soft:var(--pE-soft)}

.part-head{
  display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;
  border-top:2px solid var(--acc);padding-top:.7em;margin-bottom:.2em;
}
.part-head h2{font-size:1.42rem;margin:0;font-weight:800;letter-spacing:-.028em}
.part-head .pk{
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);
  font-weight:800;display:inline-block;margin-bottom:.3em;
  background:var(--acc-soft);border-radius:999px;padding:.22em .7em;
}
.part-meta{font-size:.8rem;color:var(--ink-3);white-space:nowrap;font-weight:600}
.part-lede{color:var(--ink-2);max-width:72ch;margin:.6em 0 .3em;font-size:.97em}
.part-status{
  font-size:.82rem;border-radius:var(--radius);padding:.65em .95em;margin:.75em 0 .3em;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--sh-1);
}
.part-status.locked{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.part-status .pbar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:.5em}
.part-status .pbar > i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .5s ease}

.unit{
  border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);
  margin:12px 0;overflow:hidden;box-shadow:var(--sh-1);
  transition:box-shadow .2s ease,border-color .2s ease,transform .18s ease;
  --acc:var(--brand);--acc-soft:var(--brand-soft);
}
.unit[data-part="A"]{--acc:var(--pA);--acc-soft:var(--pA-soft)}
.unit[data-part="B"]{--acc:var(--pB);--acc-soft:var(--pB-soft)}
.unit[data-part="C"]{--acc:var(--pC);--acc-soft:var(--pC-soft)}
.unit[data-part="D"]{--acc:var(--pD);--acc-soft:var(--pD-soft)}
.unit[data-part="E"]{--acc:var(--pE);--acc-soft:var(--pE-soft)}
.unit:not([data-locked="1"]):hover{box-shadow:var(--shadow);border-color:var(--line-2)}
.unit[data-open="1"]{box-shadow:var(--sh-2)}

.unit-head{
  display:flex;gap:12px;align-items:flex-start;position:relative;
  padding:16px 17px 16px 20px;cursor:pointer;margin:0;font-size:1.02rem;font-weight:700;
  background:var(--surface);letter-spacing:-.012em;
  transition:background .15s ease;
}
.unit-head::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc);
  opacity:.85;
}
.unit-head:hover{background:var(--surface-2)}
.unit-head .caret{
  color:var(--acc);flex:0 0 auto;transition:transform .22s cubic-bezier(.4,0,.2,1);
  margin-top:.2em;font-size:.78em;
}
.unit[data-open="1"] .unit-head .caret{transform:rotate(90deg)}
.unit-head .un{
  flex:0 0 auto;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);
  font-weight:800;padding-top:.3em;min-width:54px;
}
.unit-head .ut{flex:1 1 auto;min-width:0}
.unit-head .ubadge{
  flex:0 0 auto;font-size:.66rem;font-weight:800;padding:.26em .68em;border-radius:999px;
  white-space:nowrap;margin-top:.2em;letter-spacing:.02em;
}
.ubadge[data-s="not"]{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.ubadge[data-s="attempted"]{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
.ubadge[data-s="mastered"]{background:var(--green-soft);color:var(--green);border:1px solid var(--green)}
.ubadge[data-s="review"]{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue)}
.ubadge[data-s="locked"]{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.unit-body{padding:4px 20px 22px;border-top:1px solid var(--line);animation:unfold .26s cubic-bezier(.4,0,.2,1)}
@keyframes unfold{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.unit[data-locked="1"] .unit-head{cursor:not-allowed;opacity:.55}
.unit[data-locked="1"] .unit-head::before{background:var(--line-2)}
.lock-note{
  background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);
  border-radius:var(--radius);padding:.75em .95em;margin:.85em 0;font-size:.87rem;
}

.lede{font-size:1.05em;color:var(--ink-2);font-family:var(--serif);margin:1.1em 0 1.2em;max-width:68ch;line-height:1.6}

/* ---------- boxes ---------- */
.box{border-radius:var(--radius);padding:14px 16px;margin:1.2em 0;font-size:.94em}
.box h5{margin:0 0 .5em;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;font-weight:800}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}

.lo{border:1px dashed var(--line-2);background:var(--surface-2)}
.lo h5{color:var(--ink-3)}
.lo ul{margin:0;padding-left:1.15em}
.lo li{margin:.34em 0}

.evidence{border-left:3px solid var(--blue);background:var(--blue-soft)}
.evidence h5{color:var(--blue)}
.pitfall{border-left:3px solid var(--amber);background:var(--amber-soft)}
.pitfall h5{color:var(--amber)}
.pearl{border-left:3px solid var(--green);background:var(--green-soft)}
.pearl h5{color:var(--green)}
.india{border-left:3px solid var(--violet);background:var(--violet-soft)}
.india h5{color:var(--violet)}
.danger{border-left:3px solid var(--red);background:var(--red-soft)}
.danger h5{color:var(--red)}

/* dual track */
.tracks{display:grid;gap:13px;margin:1.3em 0}
@media (min-width:720px){.tracks{grid-template-columns:1fr 1fr}}
.track{
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  background:var(--surface-2);font-size:.93em;
}
.track h5{margin:0 0 .55em;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.track-id{border-top:3px solid var(--blue)}
.track-id h5{color:var(--blue)}
.track-rc{border-top:3px solid var(--amber)}
.track-rc h5{color:var(--amber)}
.track ul{padding-left:1.1em;margin:0}
.track li{margin:.32em 0}

/* tier + level tags */
.tag{
  display:inline-block;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  font-weight:800;padding:.2em .52em;border-radius:5px;vertical-align:.16em;margin-left:.45em;white-space:nowrap;
}
.t-must{background:var(--red-soft);color:var(--must);border:1px solid var(--must)}
.t-good{background:var(--amber-soft);color:var(--good);border:1px solid var(--good)}
.t-nice{background:var(--violet-soft);color:var(--nice);border:1px solid var(--nice)}
.t-e{background:var(--surface-3);color:var(--ink-2);border:1px solid var(--line-2)}
.t-a{background:var(--brand-soft);color:var(--brand-ink);border:1px solid var(--brand)}
:root[data-theme="dark"] .t-a{color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t-a{color:var(--brand)}}
.t-x{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue)}

.unit-body h4{
  font-size:1.06rem;margin:1.7em 0 .55em;padding-top:.2em;font-weight:750;letter-spacing:-.018em;
}
.unit-body h4:first-of-type{margin-top:1.1em}
.unit-body h5.sub{font-size:.95rem;margin:1.2em 0 .4em;color:var(--ink);font-weight:700}

/* ---------- tables ---------- */
.tw{
  overflow-x:auto;-webkit-overflow-scrolling:touch;margin:1.2em 0;
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1);
}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--surface)}
th,td{padding:.6em .75em;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{
  background:var(--surface-2);font-weight:800;font-size:.7rem;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-2);position:sticky;top:0;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{font-variant-numeric:tabular-nums;white-space:nowrap}
caption{caption-side:bottom;padding:.65em .75em;font-size:.78rem;color:var(--ink-3);text-align:left}

@media (max-width:560px){
  table.reflow thead{display:none}
  table.reflow tr{display:block;border-bottom:1px solid var(--line-2);padding:.5em 0}
  table.reflow td{display:flex;gap:.7em;border:0;padding:.28em .7em}
  table.reflow td::before{
    content:attr(data-label);flex:0 0 42%;font-weight:800;font-size:.74rem;
    color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;
  }
}

/* ---------- algorithms ---------- */
.algo{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;overflow-x:auto;margin:1.3em 0;box-shadow:var(--sh-1);
}
.algo pre{
  margin:0;font-family:var(--mono);font-size:.76rem;line-height:1.5;white-space:pre;color:var(--ink);
}
.algo .algo-t{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:800;margin-bottom:.65em}
@media (max-width:520px){.algo pre{font-size:.66rem}}

/* ============================================================
   SEARCH PALETTE
   ============================================================ */
.srch{
  position:fixed;inset:0;z-index:190;background:rgba(4,10,18,.5);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:max(6vh,18px) 16px 16px;animation:fade .16s ease;
}
.srch-panel{
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-xl);
  box-shadow:var(--sh-3);width:min(720px,100%);max-height:min(76vh,680px);
  display:flex;flex-direction:column;overflow:hidden;animation:rise .2s cubic-bezier(.4,0,.2,1);
}
.srch-top{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.srch-icon{color:var(--ink-3);flex:0 0 auto}
#srchInput{
  flex:1;min-width:0;border:0;background:none;color:var(--ink);
  font:inherit;font-size:1.02rem;padding:.35em 0;outline:none;
}
#srchInput::placeholder{color:var(--ink-3)}
#srchInput::-webkit-search-cancel-button{display:none}
.iconbtn.sm{min-width:32px;min-height:30px;font-size:.8rem;border-radius:8px}

.srch-results{overflow-y:auto;flex:1;min-height:0;padding:6px}
.srch-empty{padding:2.2em 1.2em;text-align:center;color:var(--ink-3);font-size:.92rem}
.sr{
  display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:.6em .75em;border-radius:10px;line-height:1.5;
}
.sr:hover,.sr[aria-selected="true"]{background:var(--surface-2)}
.sr[aria-selected="true"]{box-shadow:inset 0 0 0 1px var(--line-2)}
.sr-where{
  display:flex;align-items:center;gap:.5em;flex-wrap:wrap;
  font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;
  color:var(--acc,var(--brand));margin-bottom:.15em;
}
.sr[data-part="A"]{--acc:var(--pA)} .sr[data-part="B"]{--acc:var(--pB)}
.sr[data-part="C"]{--acc:var(--pC)} .sr[data-part="D"]{--acc:var(--pD)}
.sr[data-part="E"]{--acc:var(--pE)}
.sr-lock{
  background:var(--surface-3);color:var(--ink-2);border-radius:4px;
  padding:.14em .42em;font-size:.58rem;letter-spacing:.1em;
}
.sr-txt{font-size:.9rem;color:var(--ink-2)}
.sr-txt mark{background:var(--brand-soft);color:var(--brand-ink);border-radius:3px;padding:0 .12em;font-weight:700}
:root[data-theme="dark"] .sr-txt mark{color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sr-txt mark{color:var(--brand)}}
.sr-note{font-size:.84rem;color:var(--ink-3);font-style:italic}

.srch-foot{
  display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;
  padding:9px 14px;border-top:1px solid var(--line);background:var(--surface-2);
  font-size:.76rem;color:var(--ink-3);flex:0 0 auto;
}
.srch-keys{display:flex;align-items:center;gap:.35em;white-space:nowrap}
@media (max-width:560px){.srch-keys{display:none}}
.srch-keys kbd{
  font-family:var(--sans);font-size:.7rem;background:var(--surface);
  border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:.1em .4em;color:var(--ink-2);
}
/* the landing flash after jumping to a result */
@keyframes srchflash{0%{background:var(--brand-soft)}100%{background:transparent}}
.srch-hit{animation:srchflash 1.8s ease-out;border-radius:6px}

/* ============================================================
   FIGURES — inline SVG diagrams
   ============================================================ */
.fig{margin:1.6em 0;padding:0}
.fig-t{
  font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  font-weight:800;margin:0 0 .6em;
}
.fig-svg{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 8px 22px;box-shadow:var(--sh-1);cursor:zoom-in;position:relative;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.fig-svg:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.fig-svg::after{
  content:"Tap to enlarge";position:absolute;right:12px;bottom:7px;
  font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;
  color:var(--ink-3);opacity:.8;pointer-events:none;
}
@media (min-width:760px){.fig-svg::after{content:"Click to enlarge"}}
.figsvg{display:block;width:100%;height:auto}

.figsvg .fn rect{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}
.figsvg .ft{font-size:13.5px;font-weight:700;fill:var(--ink);letter-spacing:-.01em}
.figsvg .fl{font-size:13.5px;font-weight:400;fill:var(--ink-2)}
.figsvg .fe{fill:none;stroke:var(--line-2);stroke-width:2}
.figsvg marker path{fill:var(--line-2)}
.figsvg .fedge{font-size:11.5px;font-weight:800;fill:var(--ink-3);letter-spacing:.04em}
.figsvg .ftag{font-size:11.5px;font-style:italic;fill:var(--ink-3)}

.figsvg .fn-band rect{fill:var(--ink);stroke:var(--ink)}
.figsvg .fn-band .ft{fill:var(--paper);letter-spacing:.12em;font-size:12.5px}
.figsvg .fn-band .fl{fill:var(--paper);opacity:.85}
.figsvg .fn-ask rect{fill:var(--brand-soft);stroke:var(--brand);stroke-width:2}
.figsvg .fn-ask .ft{fill:var(--brand-ink)}
.figsvg .fn-good rect{fill:var(--green-soft);stroke:var(--green)}
.figsvg .fn-good .ft{fill:var(--green)}
.figsvg .fn-warn rect{fill:var(--amber-soft);stroke:var(--amber)}
.figsvg .fn-warn .ft{fill:var(--amber)}
.figsvg .fn-crit rect{fill:var(--red-soft);stroke:var(--red);stroke-width:2}
.figsvg .fn-crit .ft{fill:var(--red)}
.figsvg .fn-note rect{fill:var(--surface);stroke:var(--line-2);stroke-dasharray:5 4}
.figsvg .fn-note .ft{fill:var(--ink-2);font-weight:650}
:root[data-theme="dark"] .figsvg .fn-ask .ft{fill:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .figsvg .fn-ask .ft{fill:var(--brand)}}

.fig-alt{margin-top:.6em}
.fig-alt > summary{
  cursor:pointer;font-size:.78rem;color:var(--ink-3);font-weight:650;
  padding:.35em .1em;list-style:none;display:inline-flex;align-items:center;gap:.4em;
}
.fig-alt > summary::-webkit-details-marker{display:none}
.fig-alt > summary::before{content:"\25b8";transition:transform .18s ease;display:inline-block;font-size:.8em}
.fig-alt[open] > summary::before{transform:rotate(90deg)}
.fig-alt > summary:hover{color:var(--ink)}
.fig-alt .algo{margin:.5em 0 0}

.figzoom{
  position:fixed;inset:0;z-index:180;background:var(--paper);
  display:flex;flex-direction:column;animation:fade .16s ease;
}
.figzoom-head{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:1px solid var(--line);background:var(--surface);
}
.figzoom-head h2{
  margin:0;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:800;flex:1;
}
.figzoom-body{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;align-items:flex-start;justify-content:center}
.figzoom-body svg{width:100%;max-width:1100px;height:auto}
.figzoom-body .figsvg .ft,.figzoom-body .figsvg .fl{font-size:14.5px}

/* ============================================================
   MCQ
   ============================================================ */
.q{
  border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface-2);
  padding:18px;margin:1.7em 0;box-shadow:var(--sh-1);position:relative;
}
.q .qh{
  font-size:.67rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);
  font-weight:800;margin-bottom:.6em;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.q .qh .retag{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue);border-radius:5px;padding:.12em .45em;font-size:.62rem;letter-spacing:.07em}
.q .stem{font-weight:600;margin:0 0 1em;color:var(--ink);font-size:1.02em;line-height:1.55}
.opts{list-style:none;padding:0;margin:0}
.opts li{margin:.45em 0}
.opt{
  /* block, not flex: inline markup (<i>, <b>) inside an option must flow as text,
     not become separate flex columns. The letter key is positioned instead. */
  display:block;position:relative;width:100%;text-align:left;padding-left:calc(.85em + 24px + .7em) !important;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:.68em .85em;cursor:pointer;min-height:44px;align-items:flex-start;line-height:1.5;
  transition:border-color .15s ease,background .15s ease,transform .1s ease,box-shadow .15s ease;
}
.opt:hover:not([disabled]){border-color:var(--brand);background:var(--brand-soft);box-shadow:0 2px 10px -4px var(--brand-glow)}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .k{
  flex:0 0 auto;font-weight:800;font-size:.78rem;color:var(--ink-3);
  border:1px solid var(--line-2);border-radius:50%;width:24px;height:24px;
  display:inline-flex;align-items:center;justify-content:center;
  position:absolute;left:.85em;top:calc(.68em + .08em);
  transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.opt:hover:not([disabled]) .k{border-color:var(--brand);color:var(--brand)}
.opt[data-state="right"]{border-color:var(--green);background:var(--green-soft);box-shadow:none}
.opt[data-state="right"] .k{border-color:var(--green);color:var(--green);background:var(--surface)}
.opt[data-state="wrong"]{border-color:var(--red);background:var(--red-soft);box-shadow:none;animation:shake .3s ease}
.opt[data-state="wrong"] .k{border-color:var(--red);color:var(--red);background:var(--surface)}
.opt[disabled]{cursor:default}
@keyframes shake{10%,90%{transform:translateX(-1px)}30%,70%{transform:translateX(2px)}50%{transform:translateX(-2px)}}

.hintbar{display:flex;flex-wrap:wrap;gap:9px;margin:1em 0 0;align-items:center}
.hint{
  border-left:3px solid var(--violet);background:var(--violet-soft);
  border-radius:10px;padding:.7em .9em;margin:.75em 0 0;font-size:.9rem;
  animation:unfold .22s ease;
}
.hint h6{margin:0 0 .32em;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);font-weight:800}
.hint p{margin:0}

.rationale{
  margin-top:1em;padding:.95em 1.05em;border-radius:var(--radius);font-size:.92rem;
  background:var(--surface);border:1px solid var(--line);animation:unfold .24s ease;
}
.rationale h6{margin:0 0 .42em;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink-3)}
.rationale .why-wrong{margin-top:.65em;padding-top:.65em;border-top:1px dashed var(--line)}
.rationale .why-wrong b{color:var(--ink)}
.rationale .teach{margin-top:.65em;padding-top:.65em;border-top:1px dashed var(--line);font-style:italic;color:var(--ink-2)}
.remed{
  margin-top:.9em;border-left:3px solid var(--amber);background:var(--amber-soft);
  border-radius:10px;padding:.75em .95em;font-size:.88rem;color:var(--amber);
}
.remed b{color:var(--amber)}
.verdict{font-weight:800;font-size:.88rem;margin:.8em 0 0;letter-spacing:.01em}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}

.mastery-badge{
  margin-top:1.4em;padding:.78em 1em;border-radius:var(--radius);font-size:.88rem;font-weight:650;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);
  display:flex;gap:.6em;align-items:center;flex-wrap:wrap;
}
.mastery-badge[data-s="mastered"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.mastery-badge[data-s="attempted"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.mastery-badge[data-s="review"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}

/* ---------- retention card ---------- */
.retention{border-left:4px solid var(--blue)}
.retention h3{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;font-size:1.08rem}
.retention .rcount{
  font-size:.74rem;background:var(--blue);color:var(--btn-ink);border-radius:999px;
  padding:.16em .62em;font-weight:800;
}
:root[data-theme="dark"] .retention .rcount{color:#0a1a28}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .retention .rcount{color:#0a1a28}}

/* ---------- placement ---------- */
.place-q{margin:1.2em 0}
.place-q > p{font-weight:650;margin-bottom:.55em}
.place-opts{display:flex;flex-wrap:wrap;gap:9px}
.place-opts button{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:.5em .9em;cursor:pointer;font-size:.88rem;min-height:42px;color:var(--ink-2);
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.place-opts button:hover{background:var(--surface-3);color:var(--ink)}
.place-opts button[aria-pressed="true"]{
  background-color:var(--brand);background-image:linear-gradient(160deg,var(--brand),var(--brand-600));
  border-color:transparent;color:var(--btn-ink);font-weight:650;
}
.place-result{
  margin-top:1.1em;padding:1em 1.1em;border-radius:var(--radius);
  background:var(--brand-soft);border:1px solid var(--brand);font-size:.92rem;color:var(--ink);
}

/* ---------- info boxes near top ---------- */
.note-grid{display:grid;gap:15px;margin:0 0 20px}
@media (min-width:760px){.note-grid{grid-template-columns:1fr 1fr}}
.note{
  border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;
  background:var(--surface);font-size:.9rem;box-shadow:var(--sh-1);
}
.note h3{font-size:.98rem;margin:0 0 .5em;letter-spacing:-.015em}
.note ul{padding-left:1.1em;margin:0}
.note li{margin:.32em 0}
.safety{border-left:4px solid var(--red);background:var(--red-soft)}
.safety h3{color:var(--red)}
.privacy{border-left:4px solid var(--green);background:var(--green-soft)}
.privacy h3{color:var(--green)}

/* ---------- exam ---------- */
.exam-grid{display:grid;gap:13px;margin:1.1em 0}
@media (min-width:700px){.exam-grid{grid-template-columns:repeat(3,1fr)}}
.crit{
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface-2);
  transition:border-color .2s ease,background .2s ease;
}
.crit h4{margin:0 0 .35em;font-size:.92rem}
.crit .cval{font-size:1.62rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.03em}
.crit .cnote{font-size:.8rem;color:var(--ink-3)}
.crit[data-met="1"]{border-color:var(--green);background:var(--green-soft)}
.crit[data-met="1"] .cval{color:var(--green)}
.crit[data-met="0"] .cval{color:var(--ink-2)}

.exam-runner{margin-top:1.3em}
.exam-topbar{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:.65em .9em;margin-bottom:1.1em;box-shadow:var(--shadow);
  position:sticky;top:calc(var(--topbar-h) + 8px);z-index:20;
}
.exam-topbar .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.02rem;letter-spacing:-.02em}
.exam-topbar .timer.low{color:var(--red)}

/* faculty settings */
.fset{display:grid;gap:11px;margin:1.1em 0}
@media (min-width:640px){.fset{grid-template-columns:1fr 1fr}}
.fset label{display:block;font-size:.8rem;color:var(--ink-2);font-weight:650;margin-bottom:.3em}
.fset input,.fset select{
  width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;min-height:42px;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.fset input:focus,.fset select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-glow);outline:none}

/* ---------- faculty signature ---------- */
.sigfield{margin:1.2em 0 0}
.sigfield > label{display:block;font-size:.8rem;color:var(--ink-2);font-weight:650;margin-bottom:.4em}
.sigfield .opt{font-weight:400;color:var(--ink-3)}
.sigfield input[type="file"]{
  display:block;width:100%;max-width:26rem;font:inherit;font-size:.85rem;color:var(--ink-2);
  padding:.5em;border:1px dashed var(--line-2);border-radius:10px;background:var(--surface-2);cursor:pointer;
}
.sigfield input[type="file"]::file-selector-button{
  font:inherit;font-size:.82rem;font-weight:650;margin-right:.8em;cursor:pointer;
  background-color:var(--surface);color:var(--ink);border:1px solid var(--line-2);
  border-radius:8px;padding:.4em .8em;
}
.sigprev{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:.8em}
.sigbox{
  display:inline-flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:6px 10px;min-height:54px;
}
.sigbox img{max-height:44px;max-width:220px;display:block}
.sigmeta{font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- certificate ---------- */
#certArea{margin-top:1.3em}
.cert-preview{
  border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:#fff;
  box-shadow:var(--sh-2);
}
.cert-preview canvas{display:block;width:100%;height:auto}

.printroot{display:none}

/* ---------- appendices ---------- */
.appendix{
  border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);
  margin:12px 0;overflow:hidden;box-shadow:var(--sh-1);
  transition:box-shadow .2s ease,border-color .2s ease;
}
.appendix:hover{border-color:var(--line-2)}
.appendix > h3{
  display:flex;gap:11px;align-items:flex-start;padding:15px 17px;margin:0;
  cursor:pointer;font-size:1.01rem;font-weight:700;letter-spacing:-.015em;
  transition:background .15s ease;
}
.appendix > h3:hover{background:var(--surface-2)}
.appendix[data-open="1"] > h3 .caret{transform:rotate(90deg)}
.appendix > h3 .caret{color:var(--brand);transition:transform .22s cubic-bezier(.4,0,.2,1);font-size:.78em;margin-top:.2em}
.app-body{padding:4px 17px 20px;border-top:1px solid var(--line);animation:unfold .24s ease}
.app-open-note{font-size:.7rem;color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase}

/* ---------- footer ---------- */
footer{
  border-top:1px solid var(--line);margin-top:52px;padding:32px 0 54px;
  color:var(--ink-3);font-size:.85rem;
  background:linear-gradient(180deg,var(--surface) 0%,var(--paper-2) 100%);
}
footer .wrap > p{max-width:72ch}
footer a{color:var(--brand)}

.scroll-hint{font-size:.72rem;color:var(--ink-3);margin:-.7em 0 1em;font-style:italic}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- print: certificate only ---------- */
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000}
  .noprint,.masthead,.navbar,.topbar,.side,.arc,.toolbar,.card,.part,.appendix,footer,.drawer{display:none !important}
  .printroot{display:block !important}
  .printroot{page-break-inside:avoid;break-inside:avoid}
  .cert-sheet{
    border:3px double #0d6e66;padding:9mm 14mm;font-family:Georgia,serif;color:#111;
    page-break-inside:avoid;break-inside:avoid;page-break-after:avoid;
  }
  .cert-sheet p{margin:0 0 2mm;line-height:1.35}
  .cert-sheet h1{font-size:21pt;margin:0 0 2mm;color:#0d6e66;line-height:1.1}
  .cert-sheet .cn{font-size:17pt;border-bottom:1px solid #999;display:inline-block;padding:0 6mm 0.5mm;margin:1.5mm 0}
  .cert-sheet .meta{font-size:8pt;color:#333;margin:1mm 0}
  .cert-sheet .sig{display:block;margin:1mm 0 0;max-height:12mm;max-width:95mm;border-bottom:1px solid #999;padding:0 4mm 0.5mm}
  .cert-sheet table{width:100%;font-size:8pt;margin:3mm 0;border-collapse:collapse}
  .cert-sheet table td{padding:0.8mm 0;border-bottom:1px solid #e2e2e2}
  .cert-sheet .scope{font-size:6.5pt;color:#444;border-top:1px solid #bbb;padding-top:1.5mm;margin-top:2.5mm;line-height:1.3}
}
</style>
</head>
<body>
